<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>疫苗温度监控系统</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1600px; margin: 0 auto; }
        .header { text-align: center; color: white; margin-bottom: 30px; }
        .header h1 { font-size: 36px; margin-bottom: 10px; }
        .header p { font-size: 16px; opacity: 0.9; }
        
        .nav { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .nav-btn {
            padding: 12px 25px;
            background: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }
        .nav-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .nav-btn.active { background: #1e3c72; color: white; }
        
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .stat-card { background: white; border-radius: 15px; padding: 25px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .stat-icon { font-size: 40px; margin-bottom: 10px; }
        .stat-value { font-size: 32px; font-weight: bold; color: #1e3c72; }
        .stat-label { font-size: 14px; color: #999; margin-top: 5px; }
        
        .alert-banner { background: #fee2e2; border-left: 5px solid #ef4444; padding: 15px 20px; border-radius: 10px; margin-bottom: 20px; display: none; }
        .alert-banner.show { display: block; }
        .alert-banner h3 { color: #ef4444; margin-bottom: 5px; }
        
        .page { display: none; }
        .page.active { display: block; }
        
        .vaccine-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .vaccine-card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-left: 5px solid #10b981; cursor: pointer; transition: all 0.3s; position: relative; overflow: hidden; }
        .vaccine-card::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: linear-gradient(45deg, transparent, rgba(255,255,255,0.3), transparent); transform: rotate(45deg); transition: all 0.5s; opacity: 0; }
        .vaccine-card:hover::before { opacity: 1; left: 100%; }
        .vaccine-card.warning { border-left-color: #f59e0b; }
        .vaccine-card.danger { border-left-color: #ef4444; animation: pulse-danger 2s infinite; }
        .vaccine-card:hover { transform: translateY(-5px) scale(1.02); }
        .vaccine-card.expanded { grid-column: span 2; }
        
        .vaccine-detail { display: none; margin-top: 20px; padding-top: 20px; border-top: 2px solid #eee; }
        .vaccine-card.expanded .vaccine-detail { display: block; }
        .vaccine-mini-chart { width: 100%; height: 200px; }
        
        .vaccine-detail-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin: 20px 0; }
        .vaccine-detail-item { padding: 15px; background: #f8f9fa; border-radius: 10px; text-align: center; }
        .vaccine-detail-item .value { font-size: 24px; font-weight: bold; color: #1e3c72; }
        .vaccine-detail-item .label { font-size: 12px; color: #999; margin-top: 5px; }
        .vaccine-header { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .vaccine-id { font-size: 18px; font-weight: bold; }
        .vaccine-temp { font-size: 48px; font-weight: bold; text-align: center; margin: 20px 0; }
        .vaccine-temp.normal { color: #10b981; }
        .vaccine-temp.warning { color: #f59e0b; }
        .vaccine-temp.danger { color: #ef4444; }
        .vaccine-status { text-align: center; padding: 8px; border-radius: 20px; background: #d1fae5; color: #10b981; }
        .vaccine-status.warning { background: #fef3c7; color: #f59e0b; }
        .vaccine-status.danger { background: #fee2e2; color: #ef4444; }
        .vaccine-info { margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee; font-size: 13px; color: #666; }
        
        .chart-section { background: white; border-radius: 15px; padding: 25px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .chart-title { font-size: 18px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; }
        #temperatureChart { width: 100%; height: 400px; }
        #statsChart { width: 100%; height: 350px; }
        
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th, .data-table td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        .data-table th { background: #f8f9fa; font-weight: 600; }
        .data-table tr:hover { background: #f8f9fa; }
        
        .temp-badge { padding: 5px 15px; border-radius: 20px; font-weight: bold; }
        .temp-badge.normal { background: #d1fae5; color: #10b981; }
        .temp-badge.warning { background: #fef3c7; color: #f59e0b; }
        .temp-badge.danger { background: #fee2e2; color: #ef4444; }
        
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal.show { display: flex; align-items: center; justify-content: center; }
        .modal-content { background: white; border-radius: 15px; padding: 30px; max-width: 500px; width: 90%; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h2 { color: #1e3c72; }
        .close-btn { font-size: 28px; cursor: pointer; color: #999; }
        .close-btn:hover { color: #333; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 500; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; }
        .form-group input:focus { border-color: #1e3c72; outline: none; }
        
        .btn { padding: 12px 25px; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.3s; min-height: 44px; }
        .btn-primary { background: #1e3c72; color: white; }
        .btn-secondary { background: #f0f0f0; color: #555; }
        .btn-success { background: #10b981; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .btn:hover { transform: translateY(-2px); }
        
        .vaccine-actions { 
            margin-top: 15px; 
            display: flex; 
            gap: 10px; 
            flex-wrap: wrap;
            position: relative;
            z-index: 10;
        }
        .vaccine-actions .btn {
            flex: 1;
            min-width: 140px;
            touch-action: manipulation;
        }
        
        .threshold-control { background: white; border-radius: 15px; padding: 20px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .threshold-control label { margin-right: 10px; }
        .threshold-control input { width: 70px; padding: 8px; border: 2px solid #e0e0e0; border-radius: 8px; margin: 0 5px; }
        
        .expiry-warning { color: #f59e0b; font-weight: bold; }
        .expiry-danger { color: #ef4444; font-weight: bold; }
        
        @keyframes pulse-danger {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            50% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .float-animation { animation: float 3s ease-in-out infinite; }
        
        .tooltip { position: relative; }
        .tooltip::after {
            content: attr(data-tip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .tooltip:hover::after { opacity: 1; }
        
        .connection-status {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 1000;
        }
        .connection-status.online { background: #10b981; color: white; }
        .connection-status.offline { background: #ef4444; color: white; }
        
        .quick-action {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            border: none;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            transition: all 0.3s;
            z-index: 999;
        }
        .quick-action:hover { transform: scale(1.1) rotate(90deg); }
        
        .temp-trend { font-size: 14px; margin-left: 10px; }
        .temp-trend.up { color: #ef4444; }
        .temp-trend.down { color: #3b82f6; }
        .temp-trend.stable { color: #10b981; }
        
        .last-update { text-align: center; color: white; opacity: 0.8; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💊 疫苗温度监控系统</h1>
            <p>RFID标签批量读取 · 实时监控 · 异常预警 · 数据导出</p>
        </div>
        
        <div class="alert-banner" id="alertBanner">
            <h3>⚠️ 温度异常警报</h3>
            <p id="alertMessage"></p>
        </div>
        
        <div class="nav">
            <button class="nav-btn active" onclick="showPage('monitor')">📊 实时监控</button>
            <button class="nav-btn" onclick="showPage('alerts')">🚨 报警记录</button>
            <button class="nav-btn" onclick="showPage('statistics')">📈 统计分析</button>
            <button class="nav-btn" onclick="showPage('control')">🎮 设备控制</button>
            <button class="nav-btn" onclick="exportData()">📥 导出数据</button>
            <button class="nav-btn" onclick="refreshData()">🔄 刷新数据</button>
        </div>
        
        <div id="page-monitor" class="page active">
            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-icon">🌡️</div>
                    <div class="stat-value" id="avgTemp">--°C</div>
                    <div class="stat-label">平均温度</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">💊</div>
                    <div class="stat-value" id="vaccineCount">0</div>
                    <div class="stat-label">监控疫苗数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">✅</div>
                    <div class="stat-value" id="normalCount">0</div>
                    <div class="stat-label">温度正常</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">⚠️</div>
                    <div class="stat-value" id="alertCount">0</div>
                    <div class="stat-label">温度异常</div>
                </div>
            </div>
            
            <div class="threshold-control">
                <label>温度阈值：</label>
                <span>最低 <input type="number" id="minThreshold" value="24"> °C</span>
                <span>最高 <input type="number" id="maxThreshold" value="28"> °C</span>
            </div>
            
            <div class="chart-section">
                <div class="chart-title">
                    <span>📈 温度历史曲线</span>
                    <select id="vaccineSelect" onchange="loadChart()">
                        <option value="all">所有疫苗</option>
                    </select>
                </div>
                <div id="temperatureChart"></div>
            </div>
            
            <div class="chart-section">
                <div class="chart-title">📋 疫苗列表</div>
                <div class="vaccine-grid" id="vaccineGrid">
                    <div class="stat-card">加载中...</div>
                </div>
            </div>
        </div>
        
        <div id="page-alerts" class="page">
            <div class="chart-section">
                <div class="chart-title">
                    <span>🚨 报警记录</span>
                    <select id="alertFilter" onchange="loadAlerts()">
                        <option value="all">全部</option>
                        <option value="false">未确认</option>
                        <option value="true">已确认</option>
                    </select>
                </div>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>时间</th>
                            <th>RFID标签</th>
                            <th>温度</th>
                            <th>类型</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="alertTableBody">
                        <tr><td colspan="6" style="text-align:center;padding:40px;">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <div id="page-statistics" class="page">
            <div class="chart-section">
                <div class="chart-title">
                    <span>📈 温度统计趋势</span>
                    <select id="statsType" onchange="loadStatistics()">
                        <option value="daily">按天</option>
                        <option value="weekly">按周</option>
                        <option value="monthly">按月</option>
                    </select>
                </div>
                <div id="statsChart"></div>
            </div>
        </div>
        
        <div id="page-control" class="page">
            <div class="chart-section">
                <div class="chart-title">🎮 设备控制面板</div>
                
                <div style="margin-bottom:30px;">
                    <h3 style="margin-bottom:15px;color:#1e3c72;">📤 下发命令</h3>
                    <div class="form-group">
                        <label>命令名称</label>
                        <input type="text" id="commandName" placeholder="如：SetThreshold">
                    </div>
                    <div id="commandParams">
                        <div class="form-group">
                            <label>参数 <button class="btn btn-secondary" style="padding:5px 10px;font-size:12px;" onclick="addCommandParam()">+ 添加参数</button></div>
                        </div>
                    </div>
                    <button class="btn btn-primary" onclick="sendCommand()">发送命令</button>
                    <div id="commandResult" style="margin-top:15px;padding:15px;background:#f8f9fa;border-radius:8px;display:none;"></div>
                </div>
                
                <div style="margin-bottom:30px;">
                    <h3 style="margin-bottom:15px;color:#1e3c72;">⚙️ 设置属性（设备影子）</h3>
                    <div class="form-group">
                        <label>服务ID</label>
                        <input type="text" id="serviceId" value="DHDHGHETEG">
                    </div>
                    <div id="propertyParams">
                        <div class="form-group">
                            <label>属性 <button class="btn btn-secondary" style="padding:5px 10px;font-size:12px;" onclick="addPropertyParam()">+ 添加属性</button></div>
                        </div>
                    </div>
                    <button class="btn btn-primary" onclick="setProperty()">设置属性</button>
                    <div id="propertyResult" style="margin-top:15px;padding:15px;background:#f8f9fa;border-radius:8px;display:none;"></div>
                </div>
                
                <div style="margin-bottom:30px;">
                    <h3 style="margin-bottom:15px;color:#1e3c72;">💬 发送消息</h3>
                    <div class="form-group">
                        <label>消息内容</label>
                        <textarea id="messageContent" rows="4" placeholder="输入要发送的消息"></textarea>
                    </div>
                    <button class="btn btn-primary" onclick="sendMessage()">发送消息</button>
                    <div id="messageResult" style="margin-top:15px;padding:15px;background:#f8f9fa;border-radius:8px;display:none;"></div>
                </div>
            </div>
        </div>
        
        <div class="last-update">最后更新: <span id="lastUpdate">--</span></div>
    </div>
    
    <div class="connection-status online" id="connectionStatus">🟢 在线</div>
    <button class="quick-action tooltip" data-tip="快速刷新" onclick="refreshData()">🔄</button>
    
    <div class="modal" id="vaccineModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>💊 疫苗信息</h2>
                <span class="close-btn" onclick="closeModal()">&times;</span>
            </div>
            <form id="vaccineForm">
                <div class="form-group">
                    <label>RFID标签ID</label>
                    <input type="text" id="formSensorId" readonly>
                </div>
                <div class="form-group">
                    <label>疫苗名称</label>
                    <input type="text" id="formName" placeholder="如：新冠疫苗">
                </div>
                <div class="form-group">
                    <label>批次号</label>
                    <input type="text" id="formBatchNo" placeholder="如：20240115A">
                </div>
                <div class="form-group">
                    <label>有效期</label>
                    <input type="date" id="formExpiryDate">
                </div>
                <div class="form-group">
                    <label>存储位置</label>
                    <input type="text" id="formLocation" placeholder="如：1号冰箱-2层">
                </div>
                <div class="form-group">
                    <label>备注</label>
                    <textarea id="formNotes" rows="3" placeholder="其他信息"></textarea>
                </div>
                <div style="display:flex;gap:10px;">
                    <button type="submit" class="btn btn-primary">保存</button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">取消</button>
                </div>
            </form>
        </div>
    </div>
    
    <div class="modal" id="confirmModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>✅ 确认报警</h2>
                <span class="close-btn" onclick="closeConfirmModal()">&times;</span>
            </div>
            <div class="form-group">
                <label>处理备注</label>
                <textarea id="confirmNote" rows="3" placeholder="请输入处理情况"></textarea>
            </div>
            <div style="display:flex;gap:10px;">
                <button class="btn btn-success" onclick="submitConfirm()">确认</button>
                <button class="btn btn-secondary" onclick="closeConfirmModal()">取消</button>
            </div>
        </div>
    </div>
    
    <script>
        let chart, statsChart;
        let vaccineData = {};
        let vaccineInfo = {};
        let prevTemps = {};
        let currentAlertId = null;
        let refreshFailed = 0;
        
        function getTempStatus(temp) {
            const min = parseFloat(document.getElementById('minThreshold').value);
            const max = parseFloat(document.getElementById('maxThreshold').value);
            if (temp < min || temp > max) return 'danger';
            if (temp < min + 1 || temp > max - 1) return 'warning';
            return 'normal';
        }
        
        function showPage(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('page-' + page).classList.add('active');
            event.target.classList.add('active');
            
            if (page === 'alerts') loadAlerts();
            if (page === 'statistics') loadStatistics();
        }
        
        function initCharts() {
            chart = echarts.init(document.getElementById('temperatureChart'));
            statsChart = echarts.init(document.getElementById('statsChart'));
            
            chart.setOption({
                tooltip: { trigger: 'axis' },
                legend: { data: [], top: 10 },
                grid: { left: '3%', right: '4%', bottom: '15%', containLabel: true },
                xAxis: { type: 'category', boundaryGap: false, data: [] },
                yAxis: { type: 'value', name: '温度 (°C)' },
                dataZoom: [
                    { type: 'slider', show: true, xAxisIndex: [0], bottom: 10 },
                    { type: 'inside', xAxisIndex: [0] }
                ],
                series: []
            });
            
            statsChart.setOption({
                tooltip: { trigger: 'axis' },
                legend: { data: ['最高温度', '最低温度', '平均温度'] },
                xAxis: { type: 'category', data: [] },
                yAxis: { type: 'value', name: '温度 (°C)' },
                series: [
                    { name: '最高温度', type: 'line', data: [] },
                    { name: '最低温度', type: 'line', data: [] },
                    { name: '平均温度', type: 'line', data: [] }
                ]
            });
            
            window.addEventListener('resize', () => { chart.resize(); statsChart.resize(); });
        }
        
        async function refreshData() {
            try {
                const [tempRes, infoRes] = await Promise.all([
                    fetch('/api/temperature/latest?limit=100'),
                    fetch('/api/vaccine/info')
                ]);
                const tempResult = await tempRes.json();
                const infoResult = await infoRes.json();
                
                if (tempResult.success) {
                    refreshFailed = 0;
                    document.getElementById('connectionStatus').className = 'connection-status online';
                    document.getElementById('connectionStatus').innerHTML = '🟢 在线';
                    
                    vaccineInfo = infoResult.data || {};
                    updateVaccineCards(tempResult.data);
                    updateStats(tempResult.data);
                    updateVaccineSelect(tempResult.data);
                    document.getElementById('lastUpdate').textContent = new Date().toLocaleString('zh-CN');
                }
            } catch (error) {
                console.error('刷新失败:', error);
                refreshFailed++;
                if (refreshFailed >= 3) {
                    document.getElementById('connectionStatus').className = 'connection-status offline';
                    document.getElementById('connectionStatus').innerHTML = '🔴 离线';
                }
            }
        }
        
        function updateVaccineCards(data) {
            const grid = document.getElementById('vaccineGrid');
            const latestBySensor = {};
            
            data.forEach(item => {
                if (!latestBySensor[item.sensor_id] || new Date(item.timestamp) > new Date(latestBySensor[item.sensor_id].timestamp)) {
                    latestBySensor[item.sensor_id] = item;
                }
            });
            
            vaccineData = latestBySensor;
            const sensors = Object.values(latestBySensor);
            
            if (sensors.length === 0) {
                grid.innerHTML = '<div class="stat-card">暂无疫苗数据</div>';
                return;
            }
            
            grid.innerHTML = sensors.map(item => {
                const status = getTempStatus(item.temperature);
                const info = vaccineInfo[item.sensor_id] || {};
                const expiryWarning = checkExpiry(info.expiry_date);
                const trend = getTempTrend(item.sensor_id, item.temperature);
                const isExpanded = expandedCard === item.sensor_id;
                
                return `
                    <div class="vaccine-card ${status} ${isExpanded ? 'expanded' : ''}" id="card-${item.sensor_id}" onclick="toggleCard('${item.sensor_id}', event)">
                        <div class="vaccine-header">
                            <div class="vaccine-id">🏷️ ${item.sensor_id} ${isExpanded ? '▼' : '▶'}</div>
                            <div style="font-size:12px;color:#999;">${new Date(item.timestamp).toLocaleTimeString('zh-CN')}</div>
                        </div>
                        <div class="vaccine-temp ${status}">${item.temperature.toFixed(1)}°C <span class="temp-trend ${trend}">${trend === 'up' ? '↑' : trend === 'down' ? '↓' : '→'}</span></div>
                        <div class="vaccine-status ${status}">${status === 'normal' ? '✅ 正常' : status === 'warning' ? '⚠️ 接近阈值' : '❌ 温度异常'}</div>
                        ${info.name ? `
                            <div class="vaccine-info">
                                <div><strong>${info.name}</strong></div>
                                ${info.batch_no ? `<div>批次: ${info.batch_no}</div>` : ''}
                                ${info.expiry_date ? `<div class="${expiryWarning}">有效期: ${info.expiry_date}</div>` : ''}
                                ${info.location ? `<div>位置: ${info.location}</div>` : ''}
                            </div>
                        ` : ''}
                        <div class="vaccine-detail">
                            <div class="vaccine-detail-grid">
                                <div class="vaccine-detail-item">
                                    <div class="value" id="max-${item.sensor_id}">--</div>
                                    <div class="label">最高温度</div>
                                </div>
                                <div class="vaccine-detail-item">
                                    <div class="value" id="min-${item.sensor_id}">--</div>
                                    <div class="label">最低温度</div>
                                </div>
                                <div class="vaccine-detail-item">
                                    <div class="value" id="avg-${item.sensor_id}">--</div>
                                    <div class="label">平均温度</div>
                                </div>
                                <div class="vaccine-detail-item">
                                    <div class="value" id="count-${item.sensor_id}">--</div>
                                    <div class="label">数据条数</div>
                                </div>
                            </div>
                            <div style="margin-bottom:15px;font-weight:bold;color:#666;">📈 温度趋势</div>
                            <div id="chart-${item.sensor_id}" class="vaccine-mini-chart"></div>
                            <div class="vaccine-actions">
                                <button class="btn btn-primary" onclick="event.stopPropagation();event.preventDefault();openVaccineModal('${item.sensor_id}');">✏️ 编辑信息</button>
                                <button class="btn btn-secondary" onclick="event.stopPropagation();event.preventDefault();exportVaccineData('${item.sensor_id}');">📥 导出数据</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            
            if (expandedCard) {
                loadVaccineDetail(expandedCard);
            }
        }
        
        let expandedCard = null;
        
        async function toggleCard(sensorId, event) {
            event.stopPropagation();
            
            if (expandedCard === sensorId) {
                expandedCard = null;
            } else {
                expandedCard = sensorId;
            }
            
            const tempRes = await fetch('/api/temperature/latest?limit=100');
            const tempResult = await tempRes.json();
            if (tempResult.success) {
                updateVaccineCards(tempResult.data);
            }
        }
        
        async function loadVaccineDetail(sensorId) {
            try {
                const res = await fetch(`/api/temperature/history?limit=100`);
                const result = await res.json();
                
                if (result.success) {
                    const data = result.data.filter(item => item.sensorId === sensorId);
                    
                    if (data.length > 0) {
                        const temps = data.map(d => d.temperature);
                        const max = Math.max(...temps);
                        const min = Math.min(...temps);
                        const avg = temps.reduce((a, b) => a + b, 0) / temps.length;
                        
                        document.getElementById(`max-${sensorId}`).textContent = max.toFixed(1) + '°C';
                        document.getElementById(`min-${sensorId}`).textContent = min.toFixed(1) + '°C';
                        document.getElementById(`avg-${sensorId}`).textContent = avg.toFixed(1) + '°C';
                        document.getElementById(`count-${sensorId}`).textContent = data.length;
                        
                        const chartDom = document.getElementById(`chart-${sensorId}`);
                        if (chartDom) {
                            const miniChart = echarts.init(chartDom);
                            miniChart.setOption({
                                tooltip: { trigger: 'axis' },
                                grid: { left: '3%', right: '4%', top: '10%', bottom: '15%', containLabel: true },
                                xAxis: {
                                    type: 'category',
                                    data: data.map(d => new Date(d.time).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }))
                                },
                                yAxis: { type: 'value', name: '°C' },
                                series: [{
                                    type: 'line',
                                    smooth: true,
                                    data: temps,
                                    areaStyle: { color: 'rgba(30, 60, 114, 0.2)' },
                                    lineStyle: { color: '#1e3c72', width: 2 }
                                }]
                            });
                        }
                    }
                }
            } catch (error) {
                console.error('加载详情失败:', error);
            }
        }
        
        async function exportVaccineData(sensorId) {
            try {
                const res = await fetch('/api/temperature/history?limit=10000');
                const result = await res.json();
                
                if (result.success) {
                    const data = result.data.filter(item => item.sensorId === sensorId);
                    const ws = XLSX.utils.json_to_sheet(data.map(item => ({
                        '时间': new Date(item.time).toLocaleString('zh-CN'),
                        'RFID标签': item.sensorId,
                        '温度(°C)': item.temperature
                    })));
                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, '温度数据');
                    XLSX.writeFile(wb, `${sensorId}_温度数据_${new Date().toISOString().split('T')[0]}.xlsx`);
                }
            } catch (error) {
                alert('导出失败: ' + error.message);
            }
        }
        
        async function sendCommand() {
            try {
                const commandName = document.getElementById('commandName').value;
                const paras = collectParams('commandParams');
                
                const res = await fetch('/api/device/command', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command_name: commandName, paras })
                });
                
                const result = await res.json();
                const resultDiv = document.getElementById('commandResult');
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = `<strong>响应:</strong><br><pre>${JSON.stringify(result, null, 2)}</pre>`;
                resultDiv.style.background = result.success ? '#d1fae5' : '#fee2e2';
            } catch (error) {
                const resultDiv = document.getElementById('commandResult');
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = `<span style="color:red;">错误: ${error.message}</span>`;
                resultDiv.style.background = '#fee2e2';
            }
        }
        
        function addCommandParam() {
            const container = document.getElementById('commandParams');
            const div = document.createElement('div');
            div.className = 'form-group';
            div.style.cssText = 'display:flex;gap:10px;align-items:center;';
            div.innerHTML = `
                <input type="text" placeholder="参数名" style="flex:1" class="param-key">
                <input type="text" placeholder="参数值" style="flex:1" class="param-value">
                <button class="btn btn-secondary" style="padding:5px 10px;" onclick="this.parentElement.remove()">删除</button>
            `;
            container.appendChild(div);
        }
        
        async function setProperty() {
            try {
                const serviceId = document.getElementById('serviceId').value;
                const properties = collectParams('propertyParams');
                
                const res = await fetch('/api/device/property', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ services: [{ service_id: serviceId, properties }] })
                });
                
                const result = await res.json();
                const resultDiv = document.getElementById('propertyResult');
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = `<strong>响应:</strong><br><pre>${JSON.stringify(result, null, 2)}</pre>`;
                resultDiv.style.background = result.success ? '#d1fae5' : '#fee2e2';
            } catch (error) {
                const resultDiv = document.getElementById('propertyResult');
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = `<span style="color:red;">错误: ${error.message}</span>`;
                resultDiv.style.background = '#fee2e2';
            }
        }
        
        function addPropertyParam() {
            const container = document.getElementById('propertyParams');
            const div = document.createElement('div');
            div.className = 'form-group';
            div.style.cssText = 'display:flex;gap:10px;align-items:center;';
            div.innerHTML = `
                <input type="text" placeholder="属性名" style="flex:1" class="param-key">
                <input type="text" placeholder="属性值" style="flex:1" class="param-value">
                <button class="btn btn-secondary" style="padding:5px 10px;" onclick="this.parentElement.remove()">删除</button>
            `;
            container.appendChild(div);
        }
        
        function collectParams(containerId) {
            const container = document.getElementById(containerId);
            const keys = container.querySelectorAll('.param-key');
            const values = container.querySelectorAll('.param-value');
            const params = {};
            
            keys.forEach((keyInput, index) => {
                const key = keyInput.value.trim();
                const value = values[index].value.trim();
                if (key && value) {
                    params[key] = isNaN(value) ? value : Number(value);
                }
            });
            
            return params;
        }
        
        async function sendMessage() {
            try {
                const message = document.getElementById('messageContent').value;
                
                const res = await fetch('/api/device/message', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                
                const result = await res.json();
                const resultDiv = document.getElementById('messageResult');
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = `<strong>响应:</strong><br><pre>${JSON.stringify(result, null, 2)}</pre>`;
                resultDiv.style.background = result.success ? '#d1fae5' : '#fee2e2';
            } catch (error) {
                const resultDiv = document.getElementById('messageResult');
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = `<span style="color:red;">错误: ${error.message}</span>`;
                resultDiv.style.background = '#fee2e2';
            }
        }
        
        function getTempTrend(sensorId, currentTemp) {
            const prev = prevTemps[sensorId];
            prevTemps[sensorId] = currentTemp;
            
            if (!prev) return 'stable';
            const diff = currentTemp - prev;
            if (diff > 0.5) return 'up';
            if (diff < -0.5) return 'down';
            return 'stable';
        }
        
        function checkExpiry(dateStr) {
            if (!dateStr) return '';
            const expiry = new Date(dateStr);
            const now = new Date();
            const days = (expiry - now) / (1000 * 60 * 60 * 24);
            if (days < 0) return 'expiry-danger';
            if (days < 7) return 'expiry-warning';
            return '';
        }
        
        function updateStats(data) {
            const sensors = [...new Set(data.map(item => item.sensor_id))];
            const temps = data.slice(0, 100).map(item => item.temperature);
            const avg = temps.length ? (temps.reduce((a, b) => a + b, 0) / temps.length) : 0;
            
            let alertCount = 0;
            Object.values(vaccineData).forEach(item => {
                if (getTempStatus(item.temperature) !== 'normal') alertCount++;
            });
            
            document.getElementById('avgTemp').textContent = avg.toFixed(1) + '°C';
            document.getElementById('vaccineCount').textContent = sensors.length;
            document.getElementById('normalCount').textContent = sensors.length - alertCount;
            document.getElementById('alertCount').textContent = alertCount;
            
            const banner = document.getElementById('alertBanner');
            if (alertCount > 0) {
                banner.classList.add('show');
                document.getElementById('alertMessage').textContent = `${alertCount} 个疫苗温度异常`;
            } else {
                banner.classList.remove('show');
            }
        }
        
        function updateVaccineSelect(data) {
            const sensors = [...new Set(data.map(item => item.sensor_id))];
            const select = document.getElementById('vaccineSelect');
            select.innerHTML = '<option value="all">所有疫苗</option>' + sensors.map(id => `<option value="${id}">${id}</option>`).join('');
        }
        
        async function loadChart() {
            const sensor = document.getElementById('vaccineSelect').value;
            const url = '/api/temperature/history?limit=500';
            
            try {
                const res = await fetch(url);
                const result = await res.json();
                
                if (result.success && result.data.length > 0) {
                    const grouped = {};
                    result.data.forEach(item => {
                        const sid = item.sensorId;
                        if (sensor !== 'all' && sid !== sensor) return;
                        if (!grouped[sid]) grouped[sid] = [];
                        grouped[sid].push({
                            time: new Date(item.time).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }),
                            temp: item.temperature
                        });
                    });
                    
                    const times = Object.values(grouped)[0]?.map(d => d.time) || [];
                    const series = Object.keys(grouped).map(sid => ({
                        name: sid,
                        type: 'line',
                        smooth: true,
                        data: grouped[sid].map(d => d.temp)
                    }));
                    
                    chart.setOption({ legend: { data: Object.keys(grouped) }, xAxis: { data: times }, series });
                }
            } catch (error) {
                console.error('加载图表失败:', error);
            }
        }
        
        async function loadAlerts() {
            const confirmed = document.getElementById('alertFilter').value;
            const url = '/api/alerts' + (confirmed !== 'all' ? `?confirmed=${confirmed}` : '');
            
            try {
                const res = await fetch(url);
                const result = await res.json();
                
                const tbody = document.getElementById('alertTableBody');
                if (result.success && result.data.length > 0) {
                    tbody.innerHTML = result.data.map(alert => `
                        <tr>
                            <td>${new Date(alert.created_at).toLocaleString('zh-CN')}</td>
                            <td>${alert.sensor_id}</td>
                            <td><span class="temp-badge danger">${alert.temperature}°C</span></td>
                            <td>${alert.type === 'low' ? '温度过低' : '温度过高'}</td>
                            <td>${alert.confirmed ? '<span style="color:#10b981;">✅ 已确认</span>' : '<span style="color:#f59e0b;">⏳ 待处理</span>'}</td>
                            <td>${!alert.confirmed ? `<button class="btn btn-success" onclick="confirmAlert(${alert.id})">确认</button>` : ''}</td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;">暂无报警记录</td></tr>';
                }
            } catch (error) {
                console.error('加载报警失败:', error);
            }
        }
        
        function confirmAlert(id) {
            currentAlertId = id;
            document.getElementById('confirmModal').classList.add('show');
        }
        
        function closeConfirmModal() {
            document.getElementById('confirmModal').classList.remove('show');
            currentAlertId = null;
        }
        
        async function submitConfirm() {
            const note = document.getElementById('confirmNote').value;
            try {
                await fetch(`/api/alerts/${currentAlertId}/confirm`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ note })
                });
                closeConfirmModal();
                loadAlerts();
                document.getElementById('confirmNote').value = '';
            } catch (error) {
                console.error('确认失败:', error);
            }
        }
        
        async function loadStatistics() {
            const type = document.getElementById('statsType').value;
            try {
                const res = await fetch(`/api/statistics?type=${type}&limit=30`);
                const result = await res.json();
                
                if (result.success && result.data.length > 0) {
                    const dates = result.data.map(d => d.date);
                    const maxTemps = result.data.map(d => d.max_temp);
                    const minTemps = result.data.map(d => d.min_temp);
                    const avgTemps = result.data.map(d => d.avg_temp);
                    
                    statsChart.setOption({
                        xAxis: { data: dates },
                        series: [
                            { name: '最高温度', data: maxTemps },
                            { name: '最低温度', data: minTemps },
                            { name: '平均温度', data: avgTemps }
                        ]
                    });
                }
            } catch (error) {
                console.error('加载统计失败:', error);
            }
        }
        
        function openVaccineModal(sensorId) {
            const info = vaccineInfo[sensorId] || {};
            document.getElementById('formSensorId').value = sensorId;
            document.getElementById('formName').value = info.name || '';
            document.getElementById('formBatchNo').value = info.batch_no || '';
            document.getElementById('formExpiryDate').value = info.expiry_date || '';
            document.getElementById('formLocation').value = info.location || '';
            document.getElementById('formNotes').value = info.notes || '';
            document.getElementById('vaccineModal').classList.add('show');
        }
        
        function closeModal() {
            document.getElementById('vaccineModal').classList.remove('show');
        }
        
        document.getElementById('vaccineForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                sensor_id: document.getElementById('formSensorId').value,
                name: document.getElementById('formName').value,
                batch_no: document.getElementById('formBatchNo').value,
                expiry_date: document.getElementById('formExpiryDate').value,
                location: document.getElementById('formLocation').value,
                notes: document.getElementById('formNotes').value
            };
            
            try {
                await fetch('/api/vaccine/info', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                closeModal();
                refreshData();
            } catch (error) {
                console.error('保存失败:', error);
            }
        });
        
        async function exportData() {
            try {
                const res = await fetch('/api/temperature/history?limit=10000');
                const result = await res.json();
                
                if (result.success) {
                    const ws = XLSX.utils.json_to_sheet(result.data.map(item => ({
                        '时间': new Date(item.time).toLocaleString('zh-CN'),
                        'RFID标签': item.sensorId,
                        '温度(°C)': item.temperature
                    })));
                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, '温度数据');
                    XLSX.writeFile(wb, `疫苗温度数据_${new Date().toISOString().split('T')[0]}.xlsx`);
                }
            } catch (error) {
                alert('导出失败: ' + error.message);
            }
        }
        
        async function init() {
            initCharts();
            await refreshData();
            await loadChart();
            setInterval(refreshData, 5000);
        }
        
        init();
    </script>
</body>
</html>
